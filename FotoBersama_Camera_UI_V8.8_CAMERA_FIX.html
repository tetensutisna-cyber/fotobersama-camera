<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>FotoBersama — Camera UI V8.8</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{position:fixed;inset:0;touch-action:manipulation}
.screen{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;background:#000}
.canvas{
  position:absolute;top:0;left:50%;height:100%;width:auto;
  aspect-ratio:864/1536;transform:translateX(-50%);
  overflow:hidden;background:#000;
}
.camera{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;background:#000;z-index:1;
}
.visual{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:fill;display:block;z-index:2;
  pointer-events:none;user-select:none;
  -webkit-user-drag:none;
}

/* ===== UI BUTTONS — V8.1 ===== */
.ui-btn{
  position:absolute;z-index:5;border:1px solid rgba(231,190,125,.9);
  background:rgba(18,15,13,.78);color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;outline:none;backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  box-shadow:0 2px 10px rgba(0,0,0,.28);
}
.ui-btn:active{transform:scale(.96)}

.top-btn{
  top:14.5%;width:14.5%;aspect-ratio:1;border-radius:50%;
}
.flash{left:9%}
.switch{right:9%}

.icon{width:58%;height:58%;display:block}
.icon svg{width:100%;height:100%;display:block}

.bottom-btn{
  bottom:8.2%;width:20.5%;height:auto;aspect-ratio:1 / 1;border-radius:18%;
}
.quota{
  left:5.5%;
  font:500 13px/1.25 Arial,sans-serif;
  flex-direction:column;gap:3px;
}
.quota .small{font-size:12px}
.quota .num{font-size:30px;font-weight:700;line-height:1}

.gallery{
  right:5.5%;
  flex-direction:column;gap:4px;
  font:600 14px/1 Arial,sans-serif;
}
.gallery .icon{width:34%;height:48%}

.shutter{
  left:50%;bottom:8.2%;width:20.5%;aspect-ratio:1;
  transform:translateX(-50%);border-radius:50%;
  background:#fff;border:3px solid #fff;
  box-shadow:0 0 0 3px rgba(0,0,0,.9),0 0 0 5px rgba(255,255,255,.9);
}
.shutter:active{transform:translateX(-50%) scale(.96)}

.powered{
  position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);
  z-index:5;color:#fff;white-space:nowrap;text-align:center;
  font:400 12px/1.2 Arial,sans-serif;letter-spacing:.1px;
}
.powered strong{font-weight:700}

.notice{
  position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:10;
  max-width:calc(100% - 32px);padding:9px 14px;border-radius:999px;
  background:rgba(0,0,0,.82);color:#fff;
  font:600 12px/1.2 Arial,sans-serif;text-align:center;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.notice.show{opacity:1}
</style>
</head>

<script>
const video=document.getElementById('camera');
const notice=document.getElementById('notice');
let stream=null, facing='environment', noticeTimer;

function showNotice(text){
  notice.textContent=text;
  notice.classList.add('show');
  clearTimeout(noticeTimer);
  noticeTimer=setTimeout(()=>notice.classList.remove('show'),1200);
}

async function startCamera(){
  // Chrome/Android does not reliably allow getUserMedia from a local
  // content:// / file:// HTML page. Keep the live-camera path for HTTPS,
  // but use the native camera picker as the local-file fallback.
  const canUseLiveCamera =
    !!navigator.mediaDevices?.getUserMedia &&
    (window.isSecureContext || location.protocol === 'https:');

  if(!canUseLiveCamera){
    stream=null;
    return;
  }

  if(stream) stream.getTracks().forEach(t=>t.stop());

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:facing},
        width:{ideal:1080},
        height:{ideal:1920}
      },
      audio:false
    });
    video.srcObject=stream;
    await video.play();
  }catch(e){
    stream=null;
    console.warn('Live camera unavailable:',e);
  }
}

document.querySelector('.switch').onclick=()=>{
  facing=facing==='environment'?'user':'environment';

  if(stream){
    startCamera();
  }else{
    cameraInput.setAttribute(
      'capture',
      facing==='environment' ? 'environment' : 'user'
    );
    showNotice(facing==='environment' ? 'Kamera belakang' : 'Kamera depan');
  }
};

document.querySelector('.flash').onclick=async()=>{
  const track=stream?.getVideoTracks?.()[0];
  const caps=track?.getCapabilities?.();
  if(caps?.torch){
    try{
      const current=track.getSettings()?.torch===true;
      await track.applyConstraints({advanced:[{torch:!current}]});
      showNotice(!current?'Flash / torch ON':'Flash / torch OFF');
      return;
    }catch(e){}
  }
  showNotice(stream ? 'Flash mengikuti dukungan perangkat' : 'Flash diatur oleh kamera HP');
};

const quotaNum=document.getElementById('quotaNum');
let remaining=5;
let lastPhotoUrl=null;

function updateQuota(){
  quotaNum.textContent=remaining;
}

async function saveCapturedBlob(blob){
  if(!blob) {
    showNotice('Gagal mengambil foto');
    return;
  }

  if(lastPhotoUrl) URL.revokeObjectURL(lastPhotoUrl);
  lastPhotoUrl=URL.createObjectURL(blob);

  const img=new Image();
  img.onload=()=>{
    remaining--;
    updateQuota();

    window.__fotoBersamaLastPhoto = {
      blob,
      url:lastPhotoUrl,
      width:img.naturalWidth,
      height:img.naturalHeight,
      createdAt:new Date().toISOString()
    };

    showNotice('Foto berhasil diambil');
    URL.revokeObjectURL(img.src);
  };
  img.src=lastPhotoUrl;
}

async function takePhoto(){
  if(remaining<=0){
    showNotice('Sisa jepretan habis');
    return;
  }

  // Live camera path (when the page is served from HTTPS).
  if(stream && video.readyState>=2 && video.videoWidth && video.videoHeight){
    const canvas=document.createElement('canvas');
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    const ctx=canvas.getContext('2d');
    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    const blob=await new Promise(resolve=>
      canvas.toBlob(resolve,'image/jpeg',0.92)
    );
    await saveCapturedBlob(blob);
    return;
  }

  // Local content:// / file:// fallback: open Android's camera UI.
  cameraInput.value='';
  cameraInput.click();
}

document.querySelector('.shutter').onclick=takePhoto;

cameraInput.onchange=async()=>{
  const file=cameraInput.files?.[0];
  if(file) await saveCapturedBlob(file);
};

document.querySelector('.gallery').onclick=()=>{
  if(window.__fotoBersamaLastPhoto){
    showNotice('Foto terakhir tersedia — Gallery berikutnya');
  }else{
    showNotice('Belum ada foto');
  }
};
document.querySelector('.quota').onclick=()=>{
  showNotice('Sisa jepretan: '+remaining);
};

updateQuota();
startCamera();
</script>
